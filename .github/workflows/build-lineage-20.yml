name: Build LineageOS 20 (X6525)

on:
  workflow_dispatch:
    inputs:
      clean:
        description: "Wipe ccache before building"
        type: boolean
        default: false
  push:
    branches: [ working ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lineage_X6525-userdebug
    runs-on: namespace-profile-compile
    timeout-minutes: 720

    env:
      PRODUCT: lineage_X6525
      DEVICE: X6525
      LUNCH_TARGET: lineage_X6525-userdebug

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup || true
          df -h /

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device/infinix/X6525

      - name: Checkout vendor tree
        uses: actions/checkout@v4
        with:
          repository: Bocchi-The-Dev/vendor_X6525
          ref: working
          path: vendor/infinix/X6525

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          PKGS="bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
                git gnupg gperf imagemagick lib32ncurses5-dev lib32ncurses-dev \
                lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
                libncurses5 libncurses5-dev libncurses-dev libsdl1.2-dev \
                libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
                squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 \
                openjdk-11-jdk unzip git-lfs"
          for p in $PKGS; do
            sudo apt-get install -y --no-install-recommends "$p" >/dev/null 2>&1 \
              || echo "  (skipping unavailable: $p)"
          done
          echo "--- key tools ---"
          for t in ccache zip lz4 python3; do
            printf '%-8s %s\n' "$t" "$(command -v "$t" || echo MISSING)"
          done
          ls -d /usr/lib/jvm/java-11-openjdk-* || true

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref }}-
            ccache-

      - name: Set up build environment
        run: |
          if [ "${{ github.event.inputs.clean }}" = "true" ]; then
            rm -rf ~/.ccache
          fi
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name  "X6525 CI"
          git config --global user.email "ci@x6525.invalid"
          git config --global color.ui false
          echo "JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64" >> "$GITHUB_ENV"
          echo "USE_CCACHE=1"     >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_EXEC=$(command -v ccache)" >> "$GITHUB_ENV"
          ccache -M 30G
          ccache -z

      - name: repo init + sync
        run: |
          repo init --git-lfs -u https://github.com/LineageOS/android.git -b lineage-20.0
          repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags

      - name: Build ROM + vendor_boot (recovery)
        run: |
          source build/envsetup.sh
          lunch "$LUNCH_TARGET"
          # bacon builds the OTA; vendor_bootimage holds the LOS recovery ramdisk
          mka bacon vendor_bootimage -j"$(nproc)"

      - name: ccache statistics
        if: always()
        run: ccache -s || true

      - name: Upload ROM + vendor_boot (recovery)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-20.0-${{ env.DEVICE }}
          path: |
            out/target/product/${{ env.DEVICE }}/lineage-20.0-*.zip
            out/target/product/${{ env.DEVICE }}/vendor_boot.img
          if-no-files-found: error
          retention-days: 14

      - name: Upload flashable images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-20.0-${{ env.DEVICE }}-images
          path: |
            out/target/product/${{ env.DEVICE }}/boot.img
            out/target/product/${{ env.DEVICE }}/vendor_boot.img
            out/target/product/${{ env.DEVICE }}/dtbo.img
            out/target/product/${{ env.DEVICE }}/super_empty.img
            out/target/product/${{ env.DEVICE }}/recovery.img
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: out/verbose.log.gz
          if-no-files-found: ignore
          retention-days: 7
