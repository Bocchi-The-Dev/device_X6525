name: Build LineageOS 20 (X6525)

on:
  # Manual only: pushes must never start a build (costs Namespace minutes).
  # Dispatch with:  gh workflow run "Build LineageOS 20 (X6525)" --ref working
  workflow_dispatch:
    inputs:
      clean:
        description: "Wipe ccache before building"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lineage_X6525-userdebug
    runs-on: namespace-profile-compile
    timeout-minutes: 720

    env:
      PRODUCT: lineage_X6525
      DEVICE: X6525
      LUNCH_TARGET: lineage_X6525-userdebug

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup || true
          df -h /

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device/infinix/X6525

      - name: Checkout vendor tree
        uses: actions/checkout@v4
        with:
          repository: Bocchi-The-Dev/vendor_X6525
          ref: working
          path: vendor/infinix/X6525

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          PKGS="bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
                git gnupg gperf imagemagick lib32ncurses-dev \
                lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
                libncurses-dev libsdl1.2-dev \
                libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
                squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 \
                openjdk-11-jdk unzip git-lfs"
          for p in $PKGS; do
            sudo apt-get install -y --no-install-recommends "$p" >/dev/null 2>&1 \
              || echo "  (skipping unavailable: $p)"
          done
          echo "--- key tools ---"
          for t in ccache zip lz4 python3; do
            printf '%-8s %s\n' "$t" "$(command -v "$t" || echo MISSING)"
          done
          ls -d /usr/lib/jvm/java-11-openjdk-* || true

      - name: Provide legacy libncurses5/libtinfo5 (old prebuilt clang)
        # Ubuntu 24.04 only ships the .so.6 versions, but the RenderScript
        # prebuilt clang-3289846 is linked against .so.5.
        run: |
          LIBDIR=/usr/lib/x86_64-linux-gnu
          sudo ln -sf "$LIBDIR/libncurses.so.6" "$LIBDIR/libncurses.so.5"
          sudo ln -sf "$LIBDIR/libtinfo.so.6"   "$LIBDIR/libtinfo.so.5"
          sudo ldconfig
          ls -l "$LIBDIR/libncurses.so.5" "$LIBDIR/libtinfo.so.5"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref }}-
            ccache-

      - name: Set up build environment
        run: |
          if [ "${{ github.event.inputs.clean }}" = "true" ]; then
            rm -rf ~/.ccache
          fi
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name  "X6525 CI"
          git config --global user.email "ci@x6525.invalid"
          git config --global color.ui false
          echo "JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64" >> "$GITHUB_ENV"
          echo "USE_CCACHE=1"     >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_EXEC=$(command -v ccache)" >> "$GITHUB_ENV"
          export CCACHE_DIR="$HOME/.ccache"
          ccache -M 30G
          ccache -z

      - name: repo init + sync
        run: |
          repo init --git-lfs -u https://github.com/LineageOS/android.git -b lineage-20.0
          repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags

      - name: Sanity check prebuilt clang libraries
        run: |
          if ldd prebuilts/clang/host/linux-x86/clang-3289846/bin/clang.real | grep "not found"; then
            echo "Missing shared libraries for prebuilt clang"; exit 1
          fi

      - name: Stub kernel source for header generation (prebuilt kernel)
        # BoardConfig sets TARGET_KERNEL_SOURCE=kernel/infinix/X6525 but the
        # kernel is prebuilt and that tree is never synced. vendor/lineage's
        # generated_kernel_includes still runs `make -C $TARGET_KERNEL_SOURCE
        # headers_install` and fails when the dir is missing. Create a minimal
        # stub only if no real kernel source is present.
        run: |
          KDIR=kernel/infinix/X6525
          if [ ! -f "$KDIR/Makefile" ]; then
            mkdir -p "$KDIR"
            printf 'headers_install:\n\tmkdir -p $(O)/usr/include\n' > "$KDIR/Makefile"
            echo "Created stub $KDIR/Makefile"
          fi

      - name: Build ROM + vendor_boot (recovery)
        run: |
          source build/envsetup.sh
          lunch "$LUNCH_TARGET"
          # bacon builds the OTA; vendorbootimage (no underscore) holds the LOS
          # recovery ramdisk
          mka bacon vendorbootimage -j"$(nproc)"

      - name: ccache statistics
        if: always()
        run: ccache -s || true

      - name: Upload ROM + vendor_boot (recovery)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-20.0-${{ env.DEVICE }}
          path: |
            out/target/product/${{ env.DEVICE }}/lineage-20.0-*.zip
            out/target/product/${{ env.DEVICE }}/vendor_boot.img
          if-no-files-found: error
          retention-days: 14

      - name: Upload flashable images
        # Images are complete before the build-time VINTF check runs, so salvage
        # boot/vendor_boot/dtbo even if a later packaging step fails.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-20.0-${{ env.DEVICE }}-images
          path: |
            out/target/product/${{ env.DEVICE }}/boot.img
            out/target/product/${{ env.DEVICE }}/vendor_boot.img
            out/target/product/${{ env.DEVICE }}/dtbo.img
            out/target/product/${{ env.DEVICE }}/super_empty.img
            out/target/product/${{ env.DEVICE }}/recovery.img
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: out/verbose.log.gz
          if-no-files-found: ignore
          retention-days: 7
